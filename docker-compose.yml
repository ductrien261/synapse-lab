name: synapse-lab

services:
  fe:
    build:
      context: ./fe
    working_dir: /app
    command: npm run dev:docker
    ports:
      - "3100:3100"
    volumes:
      - ./fe:/app
      - fe_node_modules:/app/node_modules
    tmpfs:
      - /app/.next
    environment:
      # Docker Desktop on Windows does not always forward bind-mount file events.
      # Webpack + polling keeps Fast Refresh reliable without restarting containers.
      WATCHPACK_POLLING: "1000"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BACKEND_API_URL: /api
      BACKEND_INTERNAL_URL: http://be:8000
      NEXT_PUBLIC_ALGO_API_URL: /algo-api
      ALGO_INTERNAL_URL: http://algo-server:8080
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
    depends_on:
      - be
      - algo-server

  be:
    build:
      context: ./be
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # DNS công khai: tránh lỗi container không phân giải được tên máy chủ Neon (sau khi máy ngủ / đổi mạng)
    dns:
      - 1.1.1.1
      - 8.8.8.8
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./be:/app
    environment:
      DEBUG: "True"
      SECRET_KEY: dev-secret-key-synapse-lab
      ALLOWED_HOSTS: "*"
      CORS_ALLOW_ALL_ORIGINS: "True"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_SERVICE_URL: http://ai:8100
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-ai-token}
      ADMIN_LOGIN_EMAIL: ${ADMIN_LOGIN_EMAIL:-}
      ALGO_SERVER_URL: http://algo-server:8080/api
      LIVEKIT_WS_URL: ${LIVEKIT_WS_URL:-ws://localhost:7880}
      LIVEKIT_API_URL: ${LIVEKIT_API_URL:-http://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
      LESSON_ASSETS_ON_S3: ${LESSON_ASSETS_ON_S3:-False}
    depends_on:
      - redis
      - ai
      - livekit

  # LiveKit local cho phòng học video. Trình duyệt kết nối qua localhost:7880,
  # còn backend gọi service này bằng hostname nội bộ http://livekit:7880.
  livekit:
    image: livekit/livekit-server:v1.13.9
    restart: unless-stopped
    command:
      - --dev
      - --bind
      - 0.0.0.0
      - --node-ip
      - ${LIVEKIT_NODE_IP:-127.0.0.1}
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"

  # Service AI: FastAPI + LangGraph (thư mục ai/). Chỉ be gọi vào.
  ai:
    build:
      context: ./ai
    # DNS công khai: tránh lỗi container không phân giải được tên máy chủ Neon (sau khi máy ngủ / đổi mạng)
    dns:
      - 1.1.1.1
      - 8.8.8.8
    working_dir: /app
    ports:
      - "8100:8100"
    volumes:
      - ./ai:/app
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-ai-token}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/1
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    depends_on:
      - redis

  algo-server:
    build:
      context: ./packages/algo-viz/server
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./packages/algo-viz/server:/app
      - ./packages/algo-viz/algorithms:/algorithms
      - ./packages/algo-viz/tracers:/tracers:ro
      - algo_server_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      HTTP_PORT: 8080
      CREDENTIALS_ENABLED: 0
      WEBHOOK_ENABLED: 0

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  fe_node_modules:
  algo_server_node_modules:
