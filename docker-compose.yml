name: synapse-lab

services:
  fe:
    build:
      context: ./fe
    working_dir: /app
    command: npm run dev:docker
    ports:
      - "3100:3100"
    volumes:
      - ./fe:/app
      - fe_node_modules:/app/node_modules
    tmpfs:
      - /app/.next
    environment:
      # Docker Desktop on Windows does not always forward bind-mount file events.
      # Webpack + polling keeps Fast Refresh reliable without restarting containers.
      WATCHPACK_POLLING: "1000"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BACKEND_API_URL: http://localhost:8000/api
      BACKEND_INTERNAL_URL: http://be:8000
      NEXT_PUBLIC_ALGO_API_URL: http://localhost:8080/api
    depends_on:
      - be
      - algo-server

  be:
    build:
      context: ./be
    extra_hosts:
      # Windows forwards host TCP 443 to the BBB instance in WSL. The
      # hostname must stay the same as the local TLS certificate.
      - "bbb.synapse.test:host-gateway"
    # DNS công khai: tránh lỗi container không phân giải được tên máy chủ Neon (sau khi máy ngủ / đổi mạng)
    dns:
      - 1.1.1.1
      - 8.8.8.8
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./be:/app
    environment:
      DEBUG: "True"
      SECRET_KEY: dev-secret-key-synapse-lab
      ALLOWED_HOSTS: "*"
      CORS_ALLOW_ALL_ORIGINS: "True"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_SERVICE_URL: http://ai:8100
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-ai-token}
      ADMIN_LOGIN_EMAIL: ${ADMIN_LOGIN_EMAIL:-}
      ALGO_SERVER_URL: http://algo-server:8080/api
      BBB_ENABLED: ${BBB_ENABLED:-false}
      BBB_URL: ${BBB_URL:-}
      BBB_SECRET: ${BBB_SECRET:-}
      BBB_CHECKSUM_ALGORITHM: ${BBB_CHECKSUM_ALGORITHM:-sha256}
      BBB_SSL_VERIFY: ${BBB_SSL_VERIFY:-true}
      BBB_CONNECT_TIMEOUT: ${BBB_CONNECT_TIMEOUT:-5}
      BBB_TIMEOUT: ${BBB_TIMEOUT:-15}
      BBB_ASSET_BASE_URL: ${BBB_ASSET_BASE_URL:-http://host.docker.internal:8000}
      BBB_RESOURCE_URL_TTL: ${BBB_RESOURCE_URL_TTL:-3600}
      BBB_QUIZ_TOKEN_TTL: ${BBB_QUIZ_TOKEN_TTL:-43200}
      SYNAPSE_LAB_URL: ${SYNAPSE_LAB_URL:-http://localhost:3100}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
    depends_on:
      - redis
      - ai

  # Service AI: FastAPI + LangGraph (thư mục ai/). Chỉ be gọi vào.
  ai:
    build:
      context: ./ai
    # DNS công khai: tránh lỗi container không phân giải được tên máy chủ Neon (sau khi máy ngủ / đổi mạng)
    dns:
      - 1.1.1.1
      - 8.8.8.8
    working_dir: /app
    ports:
      - "8100:8100"
    volumes:
      - ./ai:/app
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-ai-token}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/1
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    depends_on:
      - redis

  algo-server:
    build:
      context: ./packages/algo-viz/server
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./packages/algo-viz/server:/app
      - ./packages/algo-viz/algorithms:/algorithms
      - algo_server_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      HTTP_PORT: 8080
      CREDENTIALS_ENABLED: 0
      WEBHOOK_ENABLED: 0

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Keep 6379 free for the local BigBlueButton Redis running in WSL.
      # Containers still connect to this service at redis:6379.
      - "6380:6379"

volumes:
  fe_node_modules:
  algo_server_node_modules:
