name: synapse-lab

services:
  fe:
    build:
      context: ./fe
    working_dir: /app
    ports:
      - "3100:3100"
    volumes:
      - ./fe:/app
      - fe_node_modules:/app/node_modules
    tmpfs:
      - /app/.next
    environment:
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BACKEND_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_ALGO_API_URL: http://localhost:8080/api
    depends_on:
      - be
      - algo-server

  be:
    build:
      context: ./be
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./be:/app
    environment:
      DEBUG: "True"
      SECRET_KEY: dev-secret-key-synapse-lab
      ALLOWED_HOSTS: "*"
      CORS_ALLOW_ALL_ORIGINS: "True"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_SERVICE_URL: http://ai:8100
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-ai-token}
      ADMIN_LOGIN_EMAIL: ${ADMIN_LOGIN_EMAIL:-}
      ALGO_SERVER_URL: http://algo-server:8080/api
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
    depends_on:
      - redis
      - ai

  # Service AI: FastAPI + LangGraph (thư mục ai/). Chỉ be gọi vào.
  ai:
    build:
      context: ./ai
    working_dir: /app
    ports:
      - "8100:8100"
    volumes:
      - ./ai:/app
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-ai-token}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/1
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    depends_on:
      - redis

  algo-server:
    build:
      context: ./packages/algo-viz/server
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./packages/algo-viz/server:/app
      - ./packages/algo-viz/algorithms:/algorithms
      - algo_server_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      HTTP_PORT: 8080
      CREDENTIALS_ENABLED: 0
      WEBHOOK_ENABLED: 0

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  fe_node_modules:
  algo_server_node_modules:
