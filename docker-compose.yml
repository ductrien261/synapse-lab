name: synapse-lab

services:
  frontend:
    build:
      context: ./frontend
    working_dir: /app
    ports:
      - "3100:3100"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    tmpfs:
      - /app/.next
    environment:
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BACKEND_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_ALGO_API_URL: http://localhost:8080/api
    depends_on:
      - backend
      - algo-server

  backend:
    build:
      context: ./backend
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DEBUG: "True"
      SECRET_KEY: dev-secret-key-synapse-lab
      ALLOWED_HOSTS: "*"
      CORS_ALLOW_ALL_ORIGINS: "True"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/synapse_lab
    depends_on:
      postgres:
        condition: service_healthy

  algo-server:
    build:
      context: ./algorithm-visualizer/server
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./algorithm-visualizer/server:/app
      - algo_server_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      HTTP_PORT: 8080
      HTTPS_PORT: 8443
      CREDENTIALS_ENABLED: 0
      WEBHOOK_ENABLED: 0
      GITHUB_CLIENT_ID: dummy
      GITHUB_CLIENT_SECRET: dummy
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: synapse_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d synapse_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  frontend_node_modules:
  algo_server_node_modules:
