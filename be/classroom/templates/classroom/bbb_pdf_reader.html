<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #e9edf3; color: #172033; }
    body { margin: 0; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .status {
      position: fixed; top: 12px; left: 50%; z-index: 10;
      transform: translateX(-50%); padding: 7px 12px;
      border: 1px solid rgba(15, 23, 42, .12); border-radius: 999px;
      background: rgba(255, 255, 255, .94); box-shadow: 0 4px 18px rgba(15, 23, 42, .12);
      font-size: 13px; font-weight: 650; backdrop-filter: blur(8px);
    }
    .pages { width: min(100%, 1100px); margin: 0 auto; padding: 56px 18px 32px; }
    .page { display: block; width: 100%; height: auto; margin: 0 0 18px; background: #fff;
      box-shadow: 0 3px 14px rgba(15, 23, 42, .13); }
    @media (max-width: 640px) { .pages { padding: 50px 6px 20px; } .page { margin-bottom: 8px; } }
  </style>
</head>
<body>
  <div class="status"><span id="current-page">1</span> / {{ page_count }}</div>
  <main class="pages" id="pages">
    {% for page_number in page_numbers %}
      <img class="page" data-page="{{ page_number }}" src="{{ page_url }}&amp;page={{ page_number }}"
           alt="Trang {{ page_number }}" loading="{% if page_number <= 3 %}eager{% else %}lazy{% endif %}">
    {% endfor %}
  </main>
  <script>
    (() => {
      const MESSAGE_TYPE = 'synapse-pdf-reader-scroll';
      const pages = Array.from(document.querySelectorAll('.page'));
      const currentPage = document.getElementById('current-page');
      let applyingRemotePosition = false;
      let scrollFrame = 0;

      const getPosition = () => {
        const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        const viewportCenter = window.scrollY + (window.innerHeight / 2);
        let closestPage = 1;
        let closestDistance = Number.POSITIVE_INFINITY;
        pages.forEach((page, index) => {
          const center = page.offsetTop + (page.offsetHeight / 2);
          const distance = Math.abs(center - viewportCenter);
          if (distance < closestDistance) {
            closestDistance = distance;
            closestPage = index + 1;
          }
        });
        return { ratio: Math.max(0, Math.min(1, window.scrollY / maxScroll)), page: closestPage };
      };

      const reportPosition = () => {
        scrollFrame = 0;
        const position = getPosition();
        currentPage.textContent = String(position.page);
        if (!applyingRemotePosition) {
          window.parent.postMessage({ type: MESSAGE_TYPE, ...position }, window.location.origin);
        }
      };

      window.addEventListener('scroll', () => {
        if (!scrollFrame) scrollFrame = window.requestAnimationFrame(reportPosition);
      }, { passive: true });

      window.addEventListener('message', (event) => {
        if (event.origin !== window.location.origin || event.data?.type !== MESSAGE_TYPE) return;
        const ratio = Number(event.data.ratio);
        if (!Number.isFinite(ratio)) return;
        applyingRemotePosition = true;
        const maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
        window.scrollTo({ top: Math.max(0, Math.min(1, ratio)) * maxScroll, behavior: 'auto' });
        window.setTimeout(() => { applyingRemotePosition = false; reportPosition(); }, 120);
      });

      window.addEventListener('load', reportPosition);
    })();
  </script>
</body>
</html>
