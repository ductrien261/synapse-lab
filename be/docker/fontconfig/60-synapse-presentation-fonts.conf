<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    PowerPoint sometimes serializes the weight as part of the family name.
    Fontconfig otherwise treats these as unrelated families and LibreOffice
    silently falls back to Noto/DejaVu, which changes line wrapping.
  -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Cabin Bold</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Cabin</string>
    </edit>
    <edit name="weight" mode="assign">
      <const>bold</const>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq">
      <string>Cabin Medium</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Cabin</string>
    </edit>
    <edit name="weight" mode="assign">
      <const>medium</const>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq">
      <string>Be Vietnam Pro Bold</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Be Vietnam Pro</string>
    </edit>
    <edit name="weight" mode="assign">
      <const>bold</const>
    </edit>
  </match>
</fontconfig>
